<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff Manager - Prototype (HTML / CSS / JS)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    <h2>Unassigned Staff</h2>
    <button id="btnAdd" class="btn btn-green">Add New Worker</button>

    <div class="unassigned-list" id="unassignedList">
    </div>
  </div>

<div class="canvas-wrap">
  <div class="floorplan-grid">

   
    <div class="zone Conference" data-zone="Conference" data-required="false">
      <div class="zone-title">Conference</div>
      <div class="assigned-list" data-list="Conference"></div>
      <div class="zone-actions"><button class="add-btn" data-zone="Conference">+</button></div>
    </div>

    <div class="zone Reception" data-zone="Reception" data-required="true">
      <div class="zone-title">Reception</div>
      <div class="assigned-list" data-list="Reception"></div>
      <div class="zone-actions"><button class="add-btn" data-zone="Reception">+</button></div>
    </div>

    <div class="zone Servers" data-zone="Servers" data-required="true">
      <div class="zone-title">Servers Room</div>
      <div class="assigned-list" data-list="Servers"></div>
      <div class="zone-actions"><button class="add-btn" data-zone="Servers">+</button></div>
    </div>


    <div class="zone Security" data-zone="Security" data-required="true">
      <div class="zone-title">Security Room</div>
      <div class="assigned-list" data-list="Security"></div>
      <div class="zone-actions"><button class="add-btn" data-zone="Security">+</button></div>
    </div>

    <div class="zone Staff" data-zone="Staff" data-required="false">
      <div class="zone-title">Staff Room</div>
      <div class="assigned-list" data-list="Staff"></div>
      <div class="zone-actions"><button class="add-btn" data-zone="Staff">+</button></div>
    </div>

    <div class="zone Archives" data-zone="Archives" data-required="true">
      <div class="zone-title">Vault / Archives</div>
      <div class="assigned-list" data-list="Archives"></div>
      <div class="zone-actions"><button class="add-btn" data-zone="Archives">+</button></div>
    </div>

  </div>
</div>


  <div class="modal-back" id="modalBack">
    <div class="modal" id="modal">
      <h3>Ajouter un employé</h3>
      <div class="form-row">
        <div class="col">
          <label>Nom</label>
          <input id="inpName" type="text" placeholder="Nom complet">
        </div>
        <div class="col">
          <label>Rôle</label>
          <select id="inpRole">
            <option value="receptionist"> Réceptionnistes</option>
            <option value="it">Techniciens IT</option>
            <option value="security">Agents de sécurité</option>
            <option value="manager">Manager</option>
            <option value="cleaning">nettoyage</option>
            <option value="other">autre</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="col">
          <label>Photo (URL)</label>
          <input id="inpPhoto" type="url" placeholder="https://...">
          <img id="photoPreview" style="width:60px;height:60px;border-radius:8px;display:none;margin-top:8px">

        </div>
        <div class="col">
          <label>Email</label>
          <input id="inpEmail" type="email" placeholder="email@example.com">
        </div>
      </div>

      <div class="form-row">
        <div class="col">
          <label>Téléphone</label>
          <input id="inpPhone" type="tel" placeholder="+212...">
        </div>
        <div class="col">
          <label>Expériences (titre — start — end)</label>
          <div id="experiences" class="experiences"></div>
          <button id="addExp" class="small-btn">+ Ajouter expérience</button>
        </div>
      </div>
      
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
        <button id="cancelModal" class="small-btn">Annuler</button>
        
        <button id="saveWorker" class="btn btn-green">Enregistrer</button>
      </div>
    </div>
  </div>

  <div class="profile-popup" id="profilePopup">
    <div id="profileContent"></div>
  </div>
<div class="modal-back" id="chooserBack">
  <div class="modal" id="chooserModal">
    <h3>Choisir un employé</h3>
    <div id="chooserList" style="display:flex;flex-wrap:wrap;gap:12px"></div>
    <button id="closeChooser" class="small-btn" style="color: black ;margin-top:12px">Fermer</button>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
